[project]
name = "termxl"
version = "0.1.0"
description = "A terminal spreadsheet that reads and writes real Excel (.xlsx) files"
requires-python = ">=3.11"
dependencies = ["textual>=8", "openpyxl>=3.1"]

[project.scripts]
txl = "termxl.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
